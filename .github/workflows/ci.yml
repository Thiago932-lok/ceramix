name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, formatação, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      JWT_SECRET: ci-access-token-com-tamanho-suficiente-0001
      JWT_REFRESH_SECRET: ci-refresh-token-com-tamanho-suficiente-0002
      LOG_LEVEL: silent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Testes
        run: npm test

      - name: Build da PWA
        run: npm run build

      - name: Migração e seed em banco temporário
        env:
          DB_PATH: ${{ runner.temp }}/ceramix-ci.db
        run: |
          npm run db:migrate
          npm run db:seed

  imagens:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    needs: qualidade
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: ceramix-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Imagem do web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: ceramix-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
